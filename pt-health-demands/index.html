<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>屏東縣衛生所需求盤點・案卷比對室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eae7db;
  --paper-deep:#e0dccb;
  --line:#c9c2a8;
  --ink:#232a25;
  --ink-soft:#5c6259;
  --seal:#a63a2e;
  --seal-soft:#a63a2e22;
  --health:#1f6f5c;
  --health-deep:#123c30;
  --highlight:#e8c468;
  --card-bg:#f4f2e8;
  --shadow: 2px 3px 0 rgba(35,42,37,0.08);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 27px, var(--line) 27px, var(--line) 28px);
  color:var(--ink);
  font-family:'Noto Sans TC', sans-serif;
  padding-bottom:120px;
}
.wrap{max-width:1180px; margin:0 auto; padding:0 24px;}

/* ---------- Header / dossier cover ---------- */
header.dossier{
  position:relative;
  padding:56px 24px 40px;
  border-bottom:3px double var(--ink);
  margin-bottom:8px;
}
header.dossier .wrap{position:relative;}
.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:12.5px;
  letter-spacing:.12em;
  color:var(--ink-soft);
  text-transform:uppercase;
}
h1{
  font-family:'Noto Serif TC', serif;
  font-weight:900;
  font-size:clamp(28px,4vw,46px);
  margin:8px 0 6px;
  letter-spacing:.02em;
}
h1 .accent{color:var(--health-deep);}
.subtitle{
  font-size:15px;
  color:var(--ink-soft);
  max-width:640px;
  line-height:1.7;
}
.stamp{
  position:absolute;
  top:40px; right:24px;
  width:118px; height:118px;
  border:3px solid var(--seal);
  border-radius:50%;
  color:var(--seal);
  display:flex; align-items:center; justify-content:center;
  text-align:center;
  transform:rotate(-11deg);
  font-family:'Noto Serif TC',serif;
  font-weight:900;
  font-size:15px;
  line-height:1.35;
  opacity:.85;
  mix-blend-mode:multiply;
  pointer-events:none;
}
.stamp small{display:block; font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:9.5px; letter-spacing:.06em; margin-top:2px;}
@media (max-width:640px){.stamp{display:none;}}

.meta-strip{
  display:flex; gap:22px; flex-wrap:wrap; margin-top:20px;
  font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--ink-soft);
}
.meta-strip b{color:var(--ink); font-weight:600;}

/* ---------- Toolbar ---------- */
.toolbar{
  position:sticky; top:0; z-index:30;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  padding:14px 24px;
  backdrop-filter:blur(2px);
}
.toolbar .wrap{display:flex; gap:14px; flex-wrap:wrap; align-items:center;}
.search-slip{
  flex:1 1 260px;
  display:flex; align-items:center; gap:8px;
  background:var(--card-bg);
  border:1px solid var(--ink);
  border-radius:3px;
  padding:9px 14px;
  box-shadow:var(--shadow);
}
.search-slip svg{flex:none; opacity:.6;}
.search-slip input{
  flex:1; border:none; background:none; outline:none;
  font-family:'Noto Sans TC',sans-serif; font-size:14.5px; color:var(--ink);
}
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{
  font-family:'IBM Plex Mono', monospace;
  font-size:12px;
  padding:7px 13px;
  border:1px solid var(--ink);
  border-radius:20px;
  background:transparent;
  color:var(--ink);
  cursor:pointer;
  transition:.15s;
  white-space:nowrap;
}
.chip:hover{background:var(--paper-deep);}
.chip.active{background:var(--health-deep); border-color:var(--health-deep); color:#f4f2e8;}
.result-count{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); white-space:nowrap;}

/* ---------- Cards grid ---------- */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(258px,1fr));
  gap:16px;
  padding:26px 24px;
}
.card{
  background:var(--card-bg);
  border:1px solid var(--ink);
  border-radius:2px;
  box-shadow:var(--shadow);
  padding:16px 16px 14px;
  position:relative;
  transition:.15s transform;
  cursor:pointer;
}
.card:hover{transform:translateY(-2px);}
.card.selected{
  border-color:var(--health-deep);
  outline:2px solid var(--health-deep);
  outline-offset:2px;
}
.card .idno{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft);
  letter-spacing:.08em;
}
.card h3{
  font-family:'Noto Serif TC',serif; font-weight:700; font-size:19px;
  margin:4px 0 8px;
}
.badge-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
.badge{
  font-size:11px; padding:3px 9px; border-radius:12px;
  font-family:'IBM Plex Mono',monospace;
  border:1px solid var(--line);
  color:var(--ink-soft);
  background:var(--paper);
}
.badge.mtn{border-color:var(--health-deep); color:var(--health-deep);}
.badge.off{border-color:var(--seal); color:var(--seal);}
.card p.snippet{
  font-size:12.5px; color:var(--ink-soft); line-height:1.6;
  margin:0 0 10px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.add-btn{
  width:100%;
  font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.04em;
  padding:8px 0;
  border:1px solid var(--ink);
  background:transparent;
  cursor:pointer;
  border-radius:2px;
}
.card.selected .add-btn{background:var(--health-deep); color:#f4f2e8; border-color:var(--health-deep);}

/* ---------- Compare tray ---------- */
.tray{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--health-deep);
  color:#f4f2e8;
  border-top:3px double var(--highlight);
  box-shadow:0 -6px 18px rgba(0,0,0,.25);
}
.tray .wrap{display:flex; align-items:center; gap:14px; padding:12px 24px; flex-wrap:wrap;}
.tray-label{font-family:'IBM Plex Mono',monospace; font-size:12px; opacity:.85; white-space:nowrap;}
.tray-chips{display:flex; gap:8px; flex-wrap:wrap; flex:1;}
.tray-chip{
  display:flex; align-items:center; gap:6px;
  background:#ffffff14; border:1px solid #ffffff55; border-radius:16px;
  padding:5px 6px 5px 12px; font-size:13px;
}
.tray-chip button{
  background:none; border:none; color:#f4f2e8; cursor:pointer; font-size:14px;
  width:20px; height:20px; border-radius:50%; opacity:.75;
}
.tray-chip button:hover{background:#ffffff30; opacity:1;}
.tray-actions{display:flex; gap:10px;}
.btn-primary{
  background:var(--seal); color:#fff; border:none; border-radius:3px;
  padding:10px 18px; font-family:'Noto Sans TC',sans-serif; font-weight:700; font-size:14px;
  cursor:pointer;
}
.btn-ghost{
  background:none; border:1px solid #ffffff66; color:#f4f2e8; border-radius:3px;
  padding:10px 14px; font-size:13px; cursor:pointer;
}
.tray.empty .tray-actions .btn-primary{opacity:.4; pointer-events:none;}

/* ---------- Comparison ledger ---------- */
#compare-section{padding:10px 24px 60px;}
.ledger-head{
  display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px;
  margin:34px 0 14px;
}
.ledger-head h2{
  font-family:'Noto Serif TC',serif; font-size:24px; margin:0;
}
.ledger-head h2 .n{color:var(--seal);}
.toggle-diff{
  font-family:'IBM Plex Mono',monospace; font-size:12px;
  display:flex; align-items:center; gap:6px; cursor:pointer; color:var(--ink-soft);
}
.ledger-wrap{
  overflow-x:auto;
  border:1px solid var(--ink);
  background:var(--card-bg);
  box-shadow:var(--shadow);
}
table.ledger{border-collapse:collapse; width:100%; min-width:640px;}
table.ledger th, table.ledger td{
  border-bottom:1px solid var(--line);
  border-right:1px solid var(--line);
  padding:12px 14px;
  vertical-align:top;
  font-size:13px;
  line-height:1.65;
}
table.ledger th{text-align:left;}
table.ledger th.rowlabel{
  width:150px; min-width:150px;
  background:var(--paper-deep);
  font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600;
  color:var(--ink-soft);
  position:sticky; left:0;
}
table.ledger thead th{
  background:var(--health-deep); color:#f4f2e8;
  font-family:'Noto Serif TC',serif; font-size:15px; font-weight:700;
  position:sticky; top:0; z-index:5;
}
table.ledger thead th.rowlabel{background:var(--health-deep);}
table.ledger tr.diff td, table.ledger tr.diff th.rowlabel{background:#f7ecea;}
table.ledger tr.diff th.rowlabel{border-left:4px solid var(--seal);}
table.ledger tr.diff th.rowlabel::after{
  content:'異'; font-family:'Noto Serif TC',serif; color:var(--seal);
  border:1.5px solid var(--seal); border-radius:50%;
  width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center;
  font-size:10px; margin-left:6px; transform:rotate(-8deg);
}
.pill{
  display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px;
  border:1px solid var(--line); color:var(--ink-soft); margin:2px 4px 2px 0;
  font-family:'IBM Plex Mono',monospace;
}
.pill.uniq{border-color:var(--seal); color:var(--seal); background:var(--seal-soft);}
.pill.common{border-color:var(--health); color:var(--health-deep);}
.empty-hint{
  padding:40px 24px; text-align:center; color:var(--ink-soft); font-size:14px;
  border:1px dashed var(--line); background:var(--card-bg);
}
mark{background:var(--highlight); padding:0 2px; border-radius:2px;}

/* ---------- Tabs ---------- */
.tabs{
  border-bottom:3px double var(--ink);
  background:var(--paper);
}
.tabs .wrap{display:flex; gap:4px; padding-top:6px;}
.tab-btn{
  font-family:'Noto Serif TC',serif; font-weight:700; font-size:15px;
  padding:12px 22px 14px;
  background:none; border:none; cursor:pointer;
  color:var(--ink-soft);
  border-bottom:3px solid transparent;
  margin-bottom:-3px;
  transition:.15s;
}
.tab-btn:hover{color:var(--ink);}
.tab-btn.active{color:var(--health-deep); border-bottom-color:var(--seal);}
.view{display:none;}
.view.active{display:block;}

/* ---------- List view ---------- */
.list-toolbar{padding:18px 24px 0;}
.list-body{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:0;
  padding:18px 24px 60px;
  align-items:start;
}
@media (max-width:800px){.list-body{grid-template-columns:1fr;}}
.station-list{
  border:1px solid var(--ink);
  background:var(--card-bg);
  box-shadow:var(--shadow);
  max-height:70vh;
  overflow-y:auto;
}
.station-list-item{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:12px 16px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  font-size:14px;
}
.station-list-item:last-child{border-bottom:none;}
.station-list-item:hover{background:var(--paper-deep);}
.station-list-item.active{background:var(--health-deep); color:#f4f2e8;}
.station-list-item .idno{font-family:'IBM Plex Mono',monospace; font-size:10.5px; opacity:.65;}
.detail-panel{
  border:1px solid var(--ink);
  border-left:none;
  background:var(--card-bg);
  box-shadow:var(--shadow);
  padding:26px 28px 32px;
  min-height:70vh;
}
@media (max-width:800px){.detail-panel{border-left:1px solid var(--ink); margin-top:14px;}}
.detail-panel h2{
  font-family:'Noto Serif TC',serif; font-size:24px; margin:0 0 4px;
}
.detail-vendor{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); margin-bottom:14px;}
.detail-field{
  border-top:1px solid var(--line);
  padding:13px 0;
}
.detail-field .lbl{
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.04em;
  color:var(--health-deep); text-transform:uppercase; margin-bottom:5px; font-weight:600;
}
.detail-field .val{font-size:14px; line-height:1.75;}

footer{
  text-align:center; padding:30px 24px 10px; font-size:12px; color:var(--ink-soft);
  font-family:'IBM Plex Mono',monospace;
}
</style>
</head>

</header>

<div class="tabs">

    <button class="tab-btn" data-tab="list">衛生所列表</button>
  </div>
</div>

<div id="view-compare" class="view active">
  <div class="toolbar">
    <div class="wrap">
      <div class="search-slip">

        <button class="btn-primary" id="goCompareBtn">看比較表 ↓</button>
      </div>
    </div>
  </div>
</div>

<div id="view-list" class="view">
  <div class="list-toolbar wrap">
    <div class="search-slip">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="listSearch" placeholder="搜尋衛生所名稱、廠商、關鍵字…（例如：麟洛、讀卡衝突、離線）">
    </div>
  </div>
  <div class="list-body wrap">
    <div class="station-list" id="stationList"></div>
    <div class="detail-panel" id="detailPanel"></div>
  </div>
</div>

<footer>屏東縣衛生所需求盤點分析報告 · 資料整理自問卷原始回覆，文字經摘錄與合併，如需逐字核對請回查原始 xlsx</footer>

const FILTERS = [
 {key:"mtn", label:"山地離島", test:s=>s.mtn},
 {key:"phis", label:"PHIS／厚生用戶", test:s=>/phis|厚生/i.test(s.vendor)},
 {key:"datong", label:"大同用戶", test:s=>/大同/.test(s.vendor)},

];

/* ============ 渲染 ============ */
const grid = document.getElementById('grid');
const chips = document.getElementById('chips');
const resultCount = document.getElementById('resultCount');
const tray = document.getElementById('tray');
const trayChips = document.getElementById('trayChips');
const compareSection = document.getElementById('compare-section');

function snippet(s){
  return `${s.pharm} · ${s.pain}`.slice(0,90) + '…';
}

function highlight(text){
  if(!query) return text;
  const re = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig');
  return String(text).replace(re, m=>`<mark>${m}</mark>`);
}

function matches(s){
  const q = query.trim().toLowerCase();
  let ok = true;
  if(q){
    const hay = [s.name,s.vendor,s.pain,s.expect,s.other,s.pharm,s.inf].join(' ').toLowerCase();
    ok = hay.includes(q);
  }
  if(ok && activeFilters.size){
    ok = [...activeFilters].every(k=>FILTERS.find(f=>f.key===k).test(s));
  }
  return ok;
}

function renderChips(){
  chips.innerHTML = FILTERS.map(f=>`<button class="chip ${activeFilters.has(f.key)?'active':''}" data-key="${f.key}">${f.label}</button>`).join('');
  chips.querySelectorAll('.chip').forEach(btn=>{
    btn.onclick = ()=>{
      const k = btn.dataset.key;
      activeFilters.has(k) ? activeFilters.delete(k) : activeFilters.add(k);
      renderAll();
    };
  });
}

function renderGrid(){
  const list = STATIONS.filter(matches);
  resultCount.textContent = `找到 ${list.length} / ${STATIONS.length} 所`;
  grid.innerHTML = list.map(s=>`
    <div class="card ${selected.has(s.id)?'selected':''}" data-id="${s.id}">
      <div class="idno">CASE #${String(s.id).padStart(2,'0')} · ${s.vendor}</div>
      <h3>${highlight(s.name)}</h3>
      <div class="badge-row">
        ${s.mtn?'<span class="badge mtn">山地離島</span>':''}
        ${s.offline?'<span class="badge off">有離線需求</span>':''}
        <span class="badge">${s.his.length} 項主體模組</span>
      </div>
      <p class="snippet">${highlight(snippet(s))}</p>
      <button class="add-btn">${selected.has(s.id) ? '✓ 已加入比較' : '＋ 加入比較'}</button>
    </div>
  `).join('') || `<div class="empty-hint">沒有符合條件的衛生所，換個關鍵字或清除篩選試試。</div>`;

  grid.querySelectorAll('.card').forEach(card=>{
    card.onclick = ()=>{
      const id = Number(card.dataset.id);
      if(selected.has(id)) selected.delete(id);
      else {
        if(selected.size>=4){ alert('最多比較 4 所，請先移除一所再新增。'); return; }
        selected.add(id);
      }
      renderAll();
    };
  });
}

function renderTray(){
  const list = [...selected].map(id=>STATIONS.find(s=>s.id===id));
  tray.classList.toggle('empty', list.length===0);
  trayChips.innerHTML = list.map(s=>`
    <span class="tray-chip">${s.name.replace('衛生所','')}<button data-id="${s.id}">×</button></span>
  `).join('') || '<span style="opacity:.6;font-size:13px;">尚未選擇，點卡片下方「＋加入比較」開始</span>';
  trayChips.querySelectorAll('button').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); selected.delete(Number(b.dataset.id)); renderAll(); };
  });
}

function fieldEqual(a,b){
  if(Array.isArray(a) && Array.isArray(b)){
    return JSON.stringify([...a].sort())===JSON.stringify([...b].sort());
  }
  return String(a).trim()===String(b).trim();
}

function renderCompare(){
  const list = [...selected].map(id=>STATIONS.find(s=>s.id===id));
  if(list.length<2){
    compareSection.innerHTML = `<div class="empty-hint">請至少選擇 2 所衛生所（例如麟洛、萬丹、九如）以展開對照表。</div>`;
    return;
  }
  const rows = FIELD_ROWS.map(([key,label])=>{
    const vals = list.map(s=> key==='mtnLabel' ? (s.mtn?'是（山地離島）':'否') : s[key]);
    const allEqual = vals.every(v=>fieldEqual(v, vals[0]));
    if(onlyDiff && allEqual) return '';
    const cells = list.map((s,i)=>{
      const v = vals[i];
      if(Array.isArray(v)){
        const others = list.filter((_,j)=>j!==i).map((_,j)=>vals[j]);
        const commonSet = v.filter(item => list.every((_,j)=> vals[j].includes(item)));
        return `<td>${v.map(item=>{
          const isCommon = list.every((_,j)=> vals[j].includes(item));
          return `<span class="pill ${isCommon?'common':'uniq'}">${item}</span>`;
        }).join('')}</td>`;
      }
      return `<td>${highlight(v)}</td>`;
    }).join('');
    return `<tr class="${allEqual?'':'diff'}"><th class="rowlabel">${label}</th>${cells}</tr>`;
  }).join('');

  compareSection.innerHTML = `
    <div class="ledger-head">
      <h2>逐項對照 · <span class="n">${list.map(s=>s.name.replace('衛生所','')).join(' vs ')}</span></h2>
      <label class="toggle-diff"><input type="checkbox" id="diffToggle" ${onlyDiff?'checked':''}> 只看有差異的項目</label>
    </div>
    <div class="ledger-wrap">
      <table class="ledger">
        <thead><tr><th class="rowlabel">比對項目</th>${list.map(s=>`<th>${s.name}</th>`).join('')}</tr></thead>
        <tbody>${rows || '<tr><td colspan="99" style="padding:20px;color:var(--ink-soft);">目前條件下沒有差異項目</td></tr>'}</tbody>
      </table>
    </div>
  `;
  document.getElementById('diffToggle').onchange = (e)=>{ onlyDiff = e.target.checked; renderCompare(); };
}

function renderAll(){
  renderChips();
  renderGrid();
  renderTray();
  renderCompare();
}

document.getElementById('search').addEventListener('input', e=>{
  query = e.target.value;
  renderGrid();
  renderCompare();
});
document.getElementById('clearBtn').onclick = ()=>{ selected.clear(); renderAll(); };
document.getElementById('goCompareBtn').onclick = ()=>{
  document.getElementById('compare-section').scrollIntoView({behavior:'smooth', block:'start'});
};

/* ============ 分頁：衛生所列表 ============ */
let listQuery = "";
let activeStationId = null;

function stationMatchesList(s){
  if(!listQuery.trim()) return true;
  const q = listQuery.trim().toLowerCase();
  const hay = [s.name,s.vendor,s.pharm,s.hw,s.vac,s.lab,s.inf,s.vacMgmt,s.offlineText,s.exempt,s.pain,s.expect,s.other, ...s.his, ...s.integ].join(' ').toLowerCase();
  return hay.includes(q);
}

function renderStationList(){
  const listEl = document.getElementById('stationList');
  const filtered = STATIONS.filter(stationMatchesList);
  if(!filtered.some(s=>s.id===activeStationId)){
    activeStationId = filtered.length ? filtered[0].id : null;
  }
  listEl.innerHTML = filtered.map(s=>`
    <div class="station-list-item ${s.id===activeStationId?'active':''}" data-id="${s.id}">
      <span>${highlight(s.name)}</span>
      <span class="idno">#${String(s.id).padStart(2,'0')}</span>
    </div>
  `).join('') || `<div style="padding:16px;font-size:13px;color:var(--ink-soft);">查無符合的衛生所</div>`;
  listEl.querySelectorAll('.station-list-item').forEach(item=>{
    item.onclick = ()=>{ activeStationId = Number(item.dataset.id); renderStationList(); renderStationDetail(); };
  });
}

function renderStationDetail(){
  const panel = document.getElementById('detailPanel');
  const s = STATIONS.find(x=>x.id===activeStationId);
  if(!s){ panel.innerHTML = `<div class="empty-hint">請從左側清單選擇一所衛生所</div>`; return; }
  const fieldsHtml = FIELD_ROWS.map(([key,label])=>{
    const v = key==='mtnLabel' ? (s.mtn?'是（山地離島）':'否') : s[key];
    const valHtml = Array.isArray(v)
      ? (v.length ? v.map(item=>`<span class="pill common">${highlight(item)}</span>`).join('') : '（未填寫）')
      : highlight(v);
    return `<div class="detail-field"><div class="lbl">${label}</div><div class="val">${valHtml}</div></div>`;
  }).join('');
  panel.innerHTML = `
    <h2>${s.name}</h2>
    <div class="detail-vendor">CASE #${String(s.id).padStart(2,'0')} · HIS 廠商：${s.vendor}${s.mtn?' · 山地離島':''}${s.offline?' · 明確表達離線需求':''}</div>
    ${fieldsHtml}
  `;
}

document.getElementById('listSearch').addEventListener('input', e=>{
  listQuery = e.target.value;
  renderStationList();
  renderStationDetail();
});

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('view-compare').classList.toggle('active', tab==='compare');
    document.getElementById('view-list').classList.toggle('active', tab==='list');
    tray.style.display = tab==='compare' ? '' : 'none';
    if(tab==='list'){ renderStationList(); renderStationDetail(); }
  };
});

renderAll();
renderStationList();
renderStationDetail();
</script>
