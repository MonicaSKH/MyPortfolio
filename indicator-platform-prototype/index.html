<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指標平台 | 醫療品質指標管理系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16262E;
  --paper:#F3F6F5;
  --surface:#FFFFFF;
  --teal:#1F6F6B;
  --teal-deep:#123C39;
  --teal-soft:#E4EFEE;
  --slate:#5B6B70;
  --slate-light:#8FA0A3;
  --line:#DCE4E2;
  --green:#2E9E5B;
  --green-soft:#E4F5EA;
  --amber:#D99A2B;
  --amber-soft:#FBF1DE;
  --red:#C1443C;
  --red-soft:#FBE7E5;
  --shadow: 0 2px 10px rgba(18,60,57,0.06), 0 1px 2px rgba(18,60,57,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Zilla Slab',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}

/* ---------- App Shell ---------- */
.app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:236px;flex-shrink:0;
  background:var(--teal-deep);
  color:#DCEFEC;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{
  padding:22px 20px 18px 20px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.brand .mark{
  display:flex;align-items:center;gap:10px;
}
.brand .mark svg{flex-shrink:0;}
.brand-name{font-family:'Zilla Slab',serif;font-size:17px;font-weight:600;color:#fff;line-height:1.2;}
.brand-sub{font-size:11px;color:#8FC4BE;letter-spacing:.04em;margin-top:2px;}

.nav{flex:1;padding:14px 10px;overflow-y:auto;}
.nav-section-label{
  font-size:10.5px;letter-spacing:.08em;color:#5F938D;
  padding:14px 10px 6px 10px;text-transform:uppercase;font-weight:600;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;border-radius:8px;
  font-size:13.5px;color:#C6E3DE;
  margin-bottom:2px;
  border:none;background:transparent;width:100%;text-align:left;
  transition:background .15s, color .15s;
}
.nav-item svg{flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--teal);color:#fff;}
.nav-item.active svg{opacity:1;}
.nav-item .tag{
  margin-left:auto;font-size:10px;font-family:'IBM Plex Mono',monospace;
  background:rgba(255,255,255,0.12);padding:1px 6px;border-radius:10px;color:#EAF7F4;
}

.sidebar-foot{
  padding:14px 18px 18px 18px;border-top:1px solid rgba(255,255,255,0.08);
  font-size:11px;color:#5F938D;line-height:1.5;
}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:62px;flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;position:sticky;top:0;z-index:20;
}
.crumb{font-size:13px;color:var(--slate);}
.crumb b{color:var(--ink);font-weight:600;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--paper);border:1px solid var(--line);border-radius:8px;
  padding:7px 12px;width:260px;
}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;width:100%;color:var(--ink);}
.avatar{
  width:32px;height:32px;border-radius:50%;background:var(--teal-soft);color:var(--teal-deep);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;font-family:'Zilla Slab',serif;
}

.content{padding:26px 30px 60px 30px;max-width:1400px;width:100%;margin:0 auto;}
.view{display:none;animation:fadein .25s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:20px;flex-wrap:wrap;}
.page-title{font-size:22px;font-weight:600;margin:0 0 4px 0;}
.page-desc{font-size:13px;color:var(--slate);margin:0;max-width:640px;line-height:1.6;}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;border:1px solid transparent;
  transition:all .15s;
}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal-deep);}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line);}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal-deep);}
.btn-sm{padding:6px 11px;font-size:12px;}

/* Cards */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);
}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.kpi{padding:18px 20px;}
.kpi-label{font-size:12px;color:var(--slate);display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.kpi-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.kpi-value{font-family:'Zilla Slab',serif;font-size:30px;font-weight:600;line-height:1;}
.kpi-sub{font-size:11.5px;color:var(--slate-light);margin-top:6px;}

/* Filter bar */
.filterbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:14px 16px;margin-bottom:16px;
}
.filterbar select, .filterbar input[type=text], .filterbar input[type=month], .filterbar input[type=number]{
  border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13px;
  background:var(--surface);color:var(--ink);outline:none;font-family:inherit;
}
.filterbar select:focus, .filterbar input:focus{border-color:var(--teal);}
.filterbar label{font-size:11.5px;color:var(--slate);display:flex;flex-direction:column;gap:4px;font-weight:600;}
.filterbar .spacer{flex:1;}

/* Category pill tabs */
.pilltabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.pilltabs button{
  border:1px solid var(--line);background:var(--surface);border-radius:20px;
  padding:7px 14px;font-size:12.5px;color:var(--slate);font-weight:600;
}
.pilltabs button.active{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff;}
.pilltabs button:hover:not(.active){border-color:var(--teal);color:var(--teal-deep);}

/* Table */
.table-wrap{overflow-x:auto;border-radius:12px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;font-size:11px;letter-spacing:.03em;text-transform:uppercase;
  color:var(--slate);background:var(--paper);padding:11px 14px;border-bottom:1px solid var(--line);
  white-space:nowrap;position:sticky;top:0;
}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFCFB;}
.code-cell{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal-deep);font-weight:600;}
.name-cell{font-weight:600;}
.subtext{font-size:11.5px;color:var(--slate-light);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-green{background:var(--green-soft);color:var(--green);}
.badge-amber{background:var(--amber-soft);color:#9C6B0C;}
.badge-red{background:var(--red-soft);color:var(--red);}
.badge-gray{background:#EEF1F0;color:var(--slate);}

/* Percentile gauge - signature component */
.gauge-wrap{display:flex;align-items:center;gap:8px;min-width:150px;}
.gauge{position:relative;width:100px;height:8px;border-radius:5px;overflow:visible;
  background:linear-gradient(to right, var(--green) 0%, var(--green) 50%, var(--amber) 50%, var(--amber) 75%, var(--red) 75%, var(--red) 100%);
}
.gauge-marker{
  position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);
  transform:translateX(-1px);
}
.gauge-marker::after{
  content:'';position:absolute;top:-5px;left:-3px;width:8px;height:8px;background:var(--ink);
  border-radius:50%;
}
.gauge-val{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;width:34px;}

/* Buttons in table */
.icon-btn{
  background:transparent;border:1px solid var(--line);border-radius:7px;width:30px;height:30px;
  display:inline-flex;align-items:center;justify-content:center;color:var(--slate);
}
.icon-btn:hover{border-color:var(--teal);color:var(--teal-deep);}

/* Modal / Drawer */
.overlay{
  position:fixed;inset:0;background:rgba(18,32,30,0.45);z-index:100;
  display:none;align-items:stretch;justify-content:flex-end;
}
.overlay.active{display:flex;}
.drawer{
  width:520px;max-width:92vw;background:var(--surface);height:100%;overflow-y:auto;
  box-shadow:-8px 0 30px rgba(0,0,0,0.15);
  animation:slidein .25s ease;
}
@keyframes slidein{from{transform:translateX(30px);opacity:.6;}to{transform:translateX(0);opacity:1;}}
.drawer-head{
  padding:22px 26px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:var(--surface);z-index:2;
}
.drawer-body{padding:22px 26px 40px 26px;}
.drawer-close{background:none;border:none;font-size:20px;color:var(--slate);line-height:1;}
.dl-section{margin-bottom:22px;}
.dl-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-light);font-weight:700;margin-bottom:6px;}
.dl-value{font-size:13.5px;line-height:1.7;color:var(--ink);}
.dl-value.mono{font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:var(--paper);padding:10px 12px;border-radius:8px;border:1px solid var(--line);white-space:pre-wrap;}
.sql-editor{
  width:100%;min-height:280px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.6;
  background:#0F2723;color:#D7F5EE;padding:14px 16px;border-radius:8px;border:1px solid var(--teal-deep);
  white-space:pre;overflow:auto;resize:vertical;outline:none;tab-size:2;
}
.sql-editor:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,111,107,0.15);}
.chart-placeholder{
  border:1.5px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--slate-light);
  font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:8px;
}

/* Toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--teal-deep);color:#fff;padding:12px 20px;border-radius:9px;font-size:13px;
  display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:all .3s ease;box-shadow:var(--shadow);z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* AI assistant floating button + chat bubbles */
.ai-fab{
  position:fixed;bottom:28px;right:28px;z-index:90;
  width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg, var(--teal) 0%, #2E8C87 60%, #3AA79E 100%);
  box-shadow:0 6px 18px rgba(18,60,57,0.35);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s ease;
}
.ai-fab:hover{transform:scale(1.07);}
.chat-bubble{max-width:88%;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.6;}
.chat-user{align-self:flex-end;background:var(--teal-deep);color:#fff;border-bottom-right-radius:3px;}
.chat-ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:3px;}
.chat-ai .dl-label{margin-top:8px;}
.ai-result-card{
  border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-top:8px;background:var(--surface);cursor:pointer;
}
.ai-result-card:hover{border-color:var(--teal);}

/* form grid */
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.formgrid .full{grid-column:1/-1;}
.field label{font-size:12px;font-weight:600;color:var(--slate);display:block;margin-bottom:5px;}
.field select,.field input{
  width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:13px;font-family:inherit;outline:none;
}
.field select:focus,.field input:focus{border-color:var(--teal);}
.upload-zone{
  border:1.5px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--slate);font-size:12.5px;
  display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper);
}
.upload-zone b{color:var(--teal-deep);}

.notice{
  display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);border:1px solid #F0DBA8;
  color:#8A5D0C;padding:12px 14px;border-radius:9px;font-size:12.5px;margin-bottom:16px;line-height:1.6;
}
.notice svg{flex-shrink:0;margin-top:1px;}

.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
@media (max-width:1100px){.two-col{grid-template-columns:1fr;} .kpi-row{grid-template-columns:1fr 1fr;} .formgrid{grid-template-columns:1fr;}}

input[type=number].mini{width:80px;font-family:'IBM Plex Mono',monospace;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;}
input[type=number].mini:focus{border-color:var(--teal);outline:none;}
.editable-note{font-size:10.5px;color:var(--slate-light);}

.section-title{font-size:15px;font-weight:600;margin:0 0 12px 0;display:flex;align-items:center;gap:8px;}
.section-title .n{
  width:22px;height:22px;border-radius:6px;background:var(--teal-soft);color:var(--teal-deep);
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-family:'IBM Plex Mono',monospace;font-weight:700;
}
.card-pad{padding:20px 22px;}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--slate);flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;}
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none"><rect width="30" height="30" rx="8" fill="#1F6F6B"/><path d="M15 7v16M8 12l7-5 7 5M8 18l7 5 7-5" stroke="#DCEFEC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>
          <div class="brand-name">指標平台</div>
          <div class="brand-sub">QUALITY INDICATOR HUB</div>
        </div>
      </div>
    </div>
    <nav class="nav" id="navList">
      <div class="nav-section-label">總覽</div>
      <button class="nav-item active" data-view="dashboard">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 9l3-3 2.5 2.5L13 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 13.5h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        總覽儀表板
      </button>

      <div class="nav-section-label">指標作業</div>
      <button class="nav-item" data-view="manage">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2" y="2.5" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M4.5 6h7M4.5 8.5h7M4.5 11h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        指標管理 <span class="tag" id="navCountManage">—</span>
      </button>
      <button class="nav-item" data-view="import">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v8m0 0L5 7m3 3l3-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 11v1.5A1.5 1.5 0 004 14h8a1.5 1.5 0 001.5-1.5V11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        醫中指標匯入
      </button>
      <button class="nav-item" data-view="threshold">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 13V7M8 13V3M13 13V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        閾值/目標值設定
      </button>
      <button class="nav-item" data-view="manual">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 13.5l2.7-.6 7-7-2.1-2.1-7 7-.6 2.7z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        指標填報(醫品中心)
      </button>
      <button class="nav-item" data-view="annual">

        年度指標查詢
      </button>

      <div class="nav-section-label">維護保留</div>
      <button class="nav-item" data-view="indmaint">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2.5l1.2 2.4 2.6.4-1.9 1.9.5 2.6L8 8.6l-2.4 1.2.5-2.6-1.9-1.9 2.6-.4L8 2.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M3 13.5h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        指標基本檔／SQL維護 <span class="tag" id="navCountIndMaint">—</span>
      </button>
      <button class="nav-item" data-view="settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.3" stroke="currentColor" stroke-width="1.3"/><path d="M8 2.5v1.4M8 12.1v1.4M13.5 8h-1.4M3.9 8H2.5M11.8 4.2l-1 1M5.2 10.8l-1 1M11.8 11.8l-1-1M5.2 5.2l-1-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        基本檔/權限維護
      </button>
    </nav>
    <div class="sidebar-foot">v2.0 CR原型 · 醫品中心 × 資訊部<br>資料為模擬示意，非實際數值</div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="crumb">指標平台 / <b id="crumbCurrent">總覽儀表板</b></div>
      <div class="topbar-right">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.3" stroke="#8FA0A3" stroke-width="1.3"/><path d="M9.2 9.2L12 12" stroke="#8FA0A3" stroke-width="1.3" stroke-linecap="round"/></svg>
          <input type="text" placeholder="搜尋指標代碼或名稱…" id="globalSearch">
        </div>
        <div class="avatar">品管</div>
      </div>
    </div>

    <div class="content" id="contentRoot">
      <!-- Views injected below -->
    </div>
  </div>
</div>

<div class="overlay" id="drawerOverlay">
  <div class="drawer" id="drawerPanel"></div>
</div>

<div class="overlay" id="aiOverlay">
  <div class="drawer" id="aiPanel" style="width:460px;display:flex;flex-direction:column;">
    <div class="drawer-head" style="flex-shrink:0;">
      <div>
        <h3 style="margin:0;font-size:16px;display:flex;align-items:center;gap:7px;">✨ AI 指標助手 <span class="badge badge-gray" style="font-weight:600;">示意功能</span></h3>
        <div class="subtext" style="margin-top:3px;">輸入一句話：找指標，或描述新指標讓 AI 生成草稿</div>
      </div>
      <button class="drawer-close" onclick="closeAIAssistant()">&times;</button>
    </div>
    <div id="aiLog" style="flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;"></div>
    <div style="flex-shrink:0;border-top:1px solid var(--line);padding:14px 20px;background:var(--surface);">

function defaultSqlSnippet(code, part){
  return `USE [KPIDB]
GO
/****** Object: StoredProcedure [QIP].[mSP_INS_QIP_${code}] ******/
CREATE PROC [QIP].[mSP_INS_QIP_${code}]
  @KPIYearMonth varchar(6) = NULL
 ,@KpiCode nvarchar(128) = '${code}'

/*===============================================
 Description: ${code} ${part==='num'?'分子':'分母'}計算邏輯
 Note: 依收案條件計算符合人次／人日
===============================================*/
SELECT COUNT(*) AS ${part==='num'?'Numerator':'Denominator'}
FROM QIP.QIPKPI main
INNER JOIN HISDB..INPTInpatientDetail e
  ON main.EncounterId = e.InpatientEncounterId
WHERE main.KPIYearMonth = @KPIYearMonth
  AND main.KpiCode = @KpiCode
  ${part==='num' ? "AND main.IsNumeratorMatch = 1" : ""}
GO`;
}
function sqlSnippet(code, part){
  const ov = SQL_OVERRIDES[`${code}_${part}`];
  return ov ? ov.sql : defaultSqlSnippet(code, part);
}

// ============ 0802醫品中心簡報回饋：歷期/同儕資料分析用模擬資料 ============
// 依簡報 p7(歷期資料分析：趨勢圖／管制圖) 與 p8(同儕資料分析：同儕/分期比較) 之呈現方式建置

const MONTH_LABELS = ["2026/01","2026/02","2026/03","2026/04","2026/05","2026/06"];

// 依指標 code 產生穩定但看似隨機的偏移量（避免每次重繪跳動）
function seedRand(str, i){
  let h = 0; for(const c of str) h = (h*31 + c.charCodeAt(0)) >>> 0;
  const x = Math.sin(h + i*17.13) * 10000;
  return x - Math.floor(x); // 0~1
}

function indicatorMonthlySeries(i){
  return MONTH_LABELS.map((m, idx)=>{
    const wobble = (seedRand(i.code, idx) - 0.5) * (i.avg * 0.32);
    return +(i.avg + wobble).toFixed(2);
  });
}

function peerSeries(i){
  const medCenter = MONTH_LABELS.map((m, idx)=> +(i.avg * (1.05 + (seedRand(i.code+'MC', idx)-0.5)*0.18)).toFixed(2));
  const regional  = MONTH_LABELS.map((m, idx)=> +(i.avg * (0.9  + (seedRand(i.code+'RG', idx)-0.5)*0.18)).toFixed(2));
  const lastYear  = MONTH_LABELS.map((m, idx)=> +(i.avg * (1.1  + (seedRand(i.code+'LY', idx)-0.5)*0.14)).toFixed(2));
  const medCenterQ3 = +(i.avg*1.18).toFixed(2);
  const regionalQ3  = +(i.avg*1.02).toFixed(2);
  return { medCenter, regional, lastYear, medCenterQ3, regionalQ3 };
}

function svgLineChart(opts){
  const { series, labels, width=560, height=250, bands=null, markers=[], yUnit='', showLegend=true } = opts;
  const padL=42, padR=bands?34:16, padT=16, padB=30;
  const innerW = width-padL-padR, innerH = height-padT-padB;
  const allVals = series.flatMap(s=>s.values).concat(bands?[bands.ucl,bands.lcl].flat():[]).filter(v=>v!=null);
  let minV = Math.min(...allVals), maxV = Math.max(...allVals);
  if(minV===maxV){ minV-=1; maxV+=1; }
  const pad = (maxV-minV)*0.15; minV -= pad; maxV = maxV+pad; if(minV<0 && allVals.every(v=>v>=0)) minV=0;
  const xStep = innerW/(labels.length-1||1);
  const yScale = v => padT + innerH - ((v-minV)/(maxV-minV))*innerH;
  const xScale = idx => padL + idx*xStep;

  const gridY = [0,1,2,3,4].map(k=> minV + (maxV-minV)*k/4);

  let svg = `<svg viewBox="0 0 ${width} ${height}" width="100%" style="overflow:visible;font-family:'IBM Plex Mono',monospace;">`;
  // gridlines
  gridY.forEach(v=>{
    const y = yScale(v);
    svg += `<line x1="${padL}" y1="${y}" x2="${width-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${y+3}" font-size="9" fill="var(--slate-light)" text-anchor="end">${v.toFixed(1)}${yUnit}</text>`;
  });
  // bands (control limits): UCL / +1SD / target / -1SD / LCL
  if(bands){
    const bandDefs = [
      {vals:bands.ucl, color:'#C1443C', label:'UCL'},
      {vals:bands.sigma1High, color:'#D99A2B', label:'+1σ'},
      {vals:bands.target, color:'#5B6B70', label:'目標', dash:'4 3'},
      {vals:bands.sigma1Low, color:'#D99A2B', label:'-1σ'},
      {vals:bands.lcl, color:'#2E9E5B', label:'LCL'},
    ];
    bandDefs.forEach(b=>{
      const pts = b.vals.map((v,idx)=> `${xScale(idx)},${yScale(v)}`).join(' ');
      svg += `<polyline points="${pts}" fill="none" stroke="${b.color}" stroke-width="1.1" stroke-dasharray="${b.dash||'2 3'}" opacity="0.85"/>`;
      const lastV = b.vals[b.vals.length-1];
      svg += `<text x="${width-padR+3}" y="${yScale(lastV)+3}" font-size="9" fill="${b.color}" font-weight="600">${b.label}</text>`;
    });
  }
  // marker shading (改善行動期間)
  markers.forEach(mk=>{
    const x = xScale(mk.idx);
    svg += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT+innerH}" stroke="#D64B8C" stroke-width="1.4" stroke-dasharray="3 2"/>`;
    svg += `<circle cx="${x}" cy="${yScale(mk.value)}" r="7" fill="none" stroke="#D64B8C" stroke-width="2"/>`;
  });
  // x labels
  labels.forEach((l,idx)=>{
    svg += `<text x="${xScale(idx)}" y="${height-8}" font-size="9" fill="var(--slate-light)" text-anchor="middle">${l.slice(2)}</text>`;
  });
  // series lines
  const palette = ['#1F6F6B','#D99A2B','#5B6B70','#C1443C','#3A7CA5'];
  series.forEach((s,si)=>{
    const color = s.color || palette[si%palette.length];
    const pts = s.values.map((v,idx)=> v==null?null:`${xScale(idx)},${yScale(v)}`).filter(Boolean).join(' ');
    svg += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.2"/>`;
    s.values.forEach((v,idx)=>{ if(v!=null) svg += `<circle cx="${xScale(idx)}" cy="${yScale(v)}" r="3" fill="${color}"/>`; });
  });
  svg += `</svg>`;

  if(showLegend){
    const legendItems = series.map((s,si)=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;"><i style="width:9px;height:9px;border-radius:50%;background:${s.color||['#1F6F6B','#D99A2B','#5B6B70','#C1443C','#3A7CA5'][si%5]};display:inline-block;"></i>${s.name}</span>`).join('');
    svg += `<div style="margin-top:6px;font-size:11.5px;color:var(--slate);">${legendItems}</div>`;
  }
  return svg;
}

<script>

const $root = document.getElementById('contentRoot');
const $crumb = document.getElementById('crumbCurrent');
const $toast = document.getElementById('toast');

const VIEW_TITLES = {

function showToast(msg){
  $toast.textContent = msg;
  $toast.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> $toast.classList.remove('show'), 2400);
}

function zone(p){ return p < 50 ? 'green' : (p <= 75 ? 'amber' : 'red'); }
function zoneLabel(p){ return p < 50 ? '綠燈' : (p <= 75 ? '黃燈' : '紅燈'); }

function buildGauge(p){
  return `<div class="gauge-wrap" title="與醫中比：第 ${p} 百分位（${zoneLabel(p)}）">
    <div class="gauge"><div class="gauge-marker" style="left:${p}%"></div></div>
    <span class="gauge-val" style="color:var(--${zone(p)==='amber'?'amber':zone(p)})">${p}%</span>
  </div>`;
}

function statusBadge(s){
  const map = {"正常":"green","停用":"gray","換指標":"amber"};
  return `<span class="badge badge-${map[s]||'gray'}">${s}</span>`;
}
function methodBadge(m){
  return `<span class="badge ${m==='系統'?'badge-green':'badge-amber'}">${m==='系統'?'⚙ 系統':'✎ 手工'}</span>`;
}

// 趨勢箭頭（9/2討論新增：本院比，與前月數值相比較，顯示於燈號右邊）
function trendArrow(t){
  const cfg = {
    up:   {rot:-45, color:'var(--red)',  title:'較前月上升'},
    down: {rot:45,  color:'var(--green)',title:'較前月下降'},
    flat: {rot:0,   color:'var(--slate-light)', title:'與前月持平'}
  }[t] || {rot:0,color:'var(--slate-light)',title:'—'};

    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7h8m0 0L7.5 3.5M11 7l-3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </span>`;
}

function escapeHtml(s){ return (s+'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// 小型彈出視窗（分子/分母 SQL 提示、圖表多URL選單 共用）
function openMiniModal(title, bodyHtml){
  let m = document.getElementById('miniModalOverlay');
  if(!m){
    m = document.createElement('div');
    m.id = 'miniModalOverlay';
    m.className = 'overlay';
    m.innerHTML = `<div class="drawer" style="width:640px;max-width:92vw;" id="miniModalPanel"></div>`;
    document.body.appendChild(m);
    m.addEventListener('click', e=>{ if(e.target===m) m.classList.remove('active'); });
  }
  document.getElementById('miniModalPanel').innerHTML = `
    <div class="drawer-head">
      <h3 style="margin:0;font-size:16px;">${title}</h3>
      <button class="drawer-close" onclick="document.getElementById('miniModalOverlay').classList.remove('active')">&times;</button>
    </div>
    <div class="drawer-body">${bodyHtml}</div>`;
  m.classList.add('active');
}

// 分子/分母 SQL 編輯器（共用元件）：產生編輯區塊 HTML，並綁定驗證/儲存/還原事件
// 供「指標基本檔／SQL維護」頁面的分頁，以及其他快速入口共用，確保全站只有一套編輯邏輯
// 內含「操作型定義」文字欄位（收案條件、計算範圍等文字說明）與「SQL 邏輯」程式碼欄位，兩者一併儲存
function sqlEditorBodyHtml(code, part){
  const partLabel = part==='num'?'分子':'分母';
  const custom = sqlIsCustom(code, part);
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span class="badge ${custom?'badge-amber':'badge-gray'}">${custom?'✎ 已自訂':'系統預設'}</span>
      <span class="subtext" id="sqlMetaText-${code}-${part}">${sqlMeta(code, part)}</span>
    </div>

    <div class="dl-label" style="margin-top:2px;">操作型定義（文字說明）</div>
    <div class="subtext" style="margin-bottom:6px;">以文字描述${partLabel}之收案條件、計算範圍與排除條件，供人工判讀與稽核對照，非程式邏輯本身。</div>
    <textarea id="opdefEditor-${code}-${part}" rows="3" style="width:100%;border:1px solid var(--line);border-radius:7px;padding:10px 12px;font-size:13px;font-family:inherit;line-height:1.6;">${escapeHtml(opDefOf(code, part))}</textarea>

    <div class="dl-label" style="margin-top:16px;">SQL 邏輯（程式碼）</div>
    <div class="subtext" style="margin-bottom:6px;">系統排程計算時實際執行之 SQL，需與上方操作型定義所述邏輯一致。</div>
    <textarea class="sql-editor" id="sqlEditor-${code}-${part}" spellcheck="false">${escapeHtml(sqlSnippet(code, part))}</textarea>

    <div class="notice" style="margin-top:12px;">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.2" stroke="#8A5D0C" stroke-width="1.3"/><path d="M7.5 5v3.4M7.5 10.4h.01" stroke="#8A5D0C" stroke-width="1.4" stroke-linecap="round"/></svg>
      修改後請先「驗證語法」確認 SQL 可執行，再「儲存並生效」；操作型定義文字會一併儲存。生效後將於下次排程時套用新邏輯計算指標數值，請務必會同資訊部覆核操作型定義與 SQL 是否一致。
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;">
      <button class="btn btn-ghost btn-sm" id="sqlResetBtn-${code}-${part}" ${custom?'':'disabled'}>還原為系統預設</button>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" id="sqlValidateBtn-${code}-${part}">🔎 驗證語法</button>
        <button class="btn btn-primary btn-sm" id="sqlSaveBtn-${code}-${part}">儲存並生效</button>
      </div>
    </div>
    <div id="sqlValidateResult-${code}-${part}" style="margin-top:8px;"></div>
  `;
}
function bindSqlEditorEvents(code, part, onChange){
  const partLabel = part==='num'?'分子':'分母';
  const editor = document.getElementById(`sqlEditor-${code}-${part}`);
  const opdefEditor = document.getElementById(`opdefEditor-${code}-${part}`);
  document.getElementById(`sqlValidateBtn-${code}-${part}`).addEventListener('click', ()=>{
    const val = editor.value.trim();
    const resultEl = document.getElementById(`sqlValidateResult-${code}-${part}`);
    // 簡易示意驗證：檢查基本關鍵字與括號配對，非真正連線資料庫執行
    const hasSelect = /select/i.test(val);
    const hasFrom = /from/i.test(val);
    const parensBalanced = (val.match(/\(/g)||[]).length === (val.match(/\)/g)||[]).length;
    if(hasSelect && hasFrom && parensBalanced){
      resultEl.innerHTML = `<div style="color:var(--green);font-size:12.5px;display:flex;align-items:center;gap:6px;"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M4.3 7.2l1.8 1.8 3.6-3.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>語法檢查通過（示意驗證，正式環境將連線測試資料庫執行）</div>`;
    } else {
      resultEl.innerHTML = `<div style="color:var(--red);font-size:12.5px;display:flex;align-items:center;gap:6px;"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M7 4v4M7 10h.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>語法檢查未通過：請確認含有 SELECT／FROM 子句，且括號數量成對。</div>`;
    }
  });
  document.getElementById(`sqlSaveBtn-${code}-${part}`).addEventListener('click', ()=>{
    const val = editor.value;
    const opdefVal = opdefEditor.value;
    if(!val.trim()){ showToast('SQL 內容不可為空'); return; }
    if(!opdefVal.trim()){ showToast('操作型定義不可為空'); return; }
    SQL_OVERRIDES[`${code}_${part}`] = { sql: val, opdef: opdefVal, editor: '目前使用者', time: new Date().toLocaleString('sv-SE').slice(0,16) };
    const ind = INDICATORS.find(x=>x.code===code);
    if(ind){
      if(part==='num') ind.numerator = opdefVal; else ind.denominator = opdefVal;
      ind.updateTime = new Date().toLocaleString('sv-SE').slice(0,16);
      ind.updater = '目前使用者';
    }
    showToast(`${code}：${partLabel}操作型定義與SQL已儲存並生效`);
    if(onChange) onChange();
  });
  document.getElementById(`sqlResetBtn-${code}-${part}`).addEventListener('click', ()=>{
    delete SQL_OVERRIDES[`${code}_${part}`];
    const ind = INDICATORS.find(x=>x.code===code);
    if(ind){
      const orig = ORIGINAL_OPDEF[`${code}_${part}`];
      if(orig!==undefined){ if(part==='num') ind.numerator = orig; else ind.denominator = orig; }
    }
    showToast(`${code}：${partLabel}操作型定義與SQL已還原為系統預設`);
    if(onChange) onChange();
  });
}

function initIndicatorCharts(i){
  let activeTab = 'trend';
  const tabsEl = document.getElementById(`chartTabs-${i.code}`);
  const areaEl = document.getElementById(`chartArea-${i.code}`);
  const noteEl = document.getElementById(`chartNote-${i.code}`);
  const dimSel = document.getElementById(`dimSelect-${i.code}`);

  function draw(){
    const dim = dimSel.value;
    const dimShift = dim==='全院' ? 0 : (seedRand(i.code+dim,0)-0.5)*i.avg*0.15;
    const monthly = indicatorMonthlySeries(i).map(v=> +(v+dimShift).toFixed(2));

    // 找出該指標已存在的改善方案連結，標記於趨勢圖上
    const markers = [];
    for(let idx=0; idx<MONTH_LABELS.length; idx++){
      if(IMPROVEMENT_LINKS[`${i.code}_${idx}`]) markers.push({idx, value: monthly[idx]});
    }

    if(activeTab==='trend'){
      areaEl.innerHTML = svgLineChart({
        series:[{name:`${i.name}（${dim}）`, values:monthly, color:'#1F6F6B'}],
        labels: MONTH_LABELS, markers
      });
      noteEl.innerHTML = markers.length ? `📍 圓圈標記處為已上傳改善／行動方案之月份（${markers.map(m=>MONTH_LABELS[m.idx]).join('、')}）` : '尚無改善方案標記。點選年度指標查詢頁面之連結圖示可新增。';
    } else if(activeTab==='control'){
      const sd = Math.abs((i.thHigh - i.avg)/2) || i.avg*0.1;
      const bands = {
        ucl: MONTH_LABELS.map(()=> i.thHigh),
        lcl: MONTH_LABELS.map(()=> i.thLow),
        sigma1High: MONTH_LABELS.map(()=> +(i.avg+sd).toFixed(2)),
        sigma1Low: MONTH_LABELS.map(()=> +(i.avg-sd).toFixed(2)),
        target: MONTH_LABELS.map(()=> i.target),
      };
      areaEl.innerHTML = svgLineChart({
        series:[{name:`${i.name}（實際值）`, values:monthly, color:'#16262E'}],
        labels: MONTH_LABELS, bands
      });
      const outOfControl = monthly.filter(v=> v>i.thHigh || v<i.thLow).length;
      noteEl.innerHTML = `管制界限：UCL ${i.thHigh}${i.unit}／LCL ${i.thLow}${i.unit}／目標 ${i.target}${i.unit}。${outOfControl>0?`<span style="color:var(--red);font-weight:600;">共 ${outOfControl} 個月超出管制界限，建議標記異常燈號並啟動改善。</span>`:'各月份均在管制界限內。'} 取代醫品部人工判讀管制圖作業。`;
    } else {
      const peer = peerSeries(i);
      areaEl.innerHTML = svgLineChart({
        series:[
          {name:'本院', values:monthly, color:'#1F6F6B'},
          {name:'去年同期值', values:peer.lastYear, color:'#8FA0A3'},
          {name:'醫學中心平均', values:peer.medCenter, color:'#D99A2B'},
          {name:'區域醫院平均', values:peer.regional, color:'#C1443C'},
        ],
        labels: MONTH_LABELS
      });
      noteEl.innerHTML = `醫學中心 Q3：${peer.medCenterQ3}${i.unit}／區域醫院 Q3：${peer.regionalQ3}${i.unit}（可於下方勾選調整比較對象，對應 THIS 同儕分析頁面設計）`;
    }
  }

  tabsEl.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      tabsEl.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      activeTab = b.dataset.tab;
      draw();
    });
  });
  dimSel.addEventListener('change', draw);
  draw();
}

let thState = { category:"全部", l2:"", keyword:"", month:"2026-06", year:"2026", quarter:"2026-Q2", granularity:"month", freezeSim:false };

function renderThreshold(el){
  el.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">閾值、平均值及目標值輸入</h1>
        <p class="page-desc">以「指標」為單位維護（不細到要素）。目標值由使用者手動輸入；平均值系統自動計算前一年平均，可手動修改；閾值＝年平均 ± 2 個標準差，同樣可手動覆寫。</p>
      </div>
      <button class="btn btn-primary" onclick="showToast('已儲存本頁修改')">儲存變更</button>
    </div>

    <div class="notice">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.2" stroke="#8A5D0C" stroke-width="1.3"/><path d="M7.5 5v3.4M7.5 10.4h.01" stroke="#8A5D0C" stroke-width="1.4" stroke-linecap="round"/></svg>
      標準差計算公式：X 為常態分布隨機變數之觀測值，μ 為分布平均值，σ 為標準差；閾值上下限 = μ ± 2σ。<br>
      9/2討論新增：<b>每年 2/1</b> 系統將自動產生前一年之目標值與平均值（目標值預帶前一年平均值）；<b>每年 3/1</b> 起該年度欄位將自動凍結、不可再修改，如需異動請洽資訊部。
    </div>

    <div class="pilltabs" id="thPills"></div>
    <div class="card filterbar" id="thL2bar" style="display:none;"></div>
    <div class="card filterbar">
      <label>指標搜尋 <input type="text" id="thKeyword" placeholder="關鍵字或代碼…" style="width:200px;"></label>
      <label>搜尋粒度
        <select id="thGranularity"><option value="year">年</option><option value="quarter">季</option><option value="month">月</option></select>
      </label>
      <label id="thPeriodWrap">期間 <input type="text" id="thMonth"></label>
      <div class="spacer"></div>
      <label style="flex-direction:row;align-items:center;gap:6px;font-weight:500;">
        <input type="checkbox" id="thFreezeSim" style="width:auto;"> 模擬 3/1 後畫面（欄位凍結）
      </label>
      <div class="subtext">共 <span id="thCount">0</span> 筆</div>
    </div>

    <div class="card table-wrap">
      <table>
        <thead><tr>
          <th>指標代碼</th><th>指標名稱</th><th>目標值<br><span class="editable-note">手動輸入</span></th>
          <th>平均值<br><span class="editable-note">自動算出，可修改</span></th>
          <th>閾值下限</th><th>閾值上限</th><th>更新時間</th><th>更新人員</th>
        </tr></thead>
        <tbody id="thBody"></tbody>
      </table>
    </div>
  `;

  const pills = document.getElementById('thPills');
  pills.innerHTML = CATEGORIES.map(c=>`<button data-cat="${c}" class="${c===thState.category?'active':''}">${c}</button>`).join('');
  pills.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ thState.category=b.dataset.cat; thState.l2=''; renderThreshold(el); }));

  const l2bar = document.getElementById('thL2bar');
  if(thState.category==='TCPI'){
    l2bar.style.display='flex';
    const allL3 = Object.entries(TCPI_L2).map(([l2,arr])=>`<optgroup label="${l2}">${arr.map(x=>`<option value="${x}">${x}</option>`).join('')}</optgroup>`).join('');
    l2bar.innerHTML = `<label>分類（第二/三層）<select id="thL2"><option value="">全部次分類</option>${allL3}</select></label>`;
    document.getElementById('thL2').value = thState.l2;
    document.getElementById('thL2').addEventListener('change', e=>{ thState.l2=e.target.value; renderTable(); });
  } else if(thState.category==='P4P'){
    l2bar.style.display='flex';
    l2bar.innerHTML = `<label>分類（第二層）<select id="thL2"><option value="">全部次分類</option>${P4P_L2.map(x=>`<option>${x}</option>`).join('')}</select></label>`;
    document.getElementById('thL2').value = thState.l2;
    document.getElementById('thL2').addEventListener('change', e=>{ thState.l2=e.target.value; renderTable(); });
  } else { l2bar.style.display='none'; }

  const granSel = document.getElementById('thGranularity');
  const periodInput = document.getElementById('thMonth');
  function syncPeriodInput(){
    const g = granSel.value;
    if(g==='year'){ periodInput.type='number'; periodInput.min=2020; periodInput.max=2030; periodInput.value = thState.year; }
    else if(g==='quarter'){ periodInput.type='text'; periodInput.placeholder='如 2026-Q2'; periodInput.value = thState.quarter; }
    else { periodInput.type='month'; periodInput.value = thState.month; }
  }
  granSel.value = thState.granularity;
  syncPeriodInput();
  granSel.addEventListener('change', ()=>{ thState.granularity = granSel.value; syncPeriodInput(); });
  periodInput.addEventListener('change', e=>{
    if(thState.granularity==='year') thState.year = e.target.value;
    else if(thState.granularity==='quarter') thState.quarter = e.target.value;
    else thState.month = e.target.value;
  });

  document.getElementById('thKeyword').value = thState.keyword;
  document.getElementById('thKeyword').addEventListener('input', e=>{ thState.keyword=e.target.value; renderTable(); });
  document.getElementById('thFreezeSim').checked = thState.freezeSim;
  document.getElementById('thFreezeSim').addEventListener('change', e=>{ thState.freezeSim = e.target.checked; renderTable(); });

  function renderTable(){
    let list = INDICATORS.filter(i=>{
      if(thState.category!=='全部' && i.category!==thState.category) return false;
      if(thState.l2 && i.l2!==thState.l2 && i.l3!==thState.l2) return false;
      if(thState.keyword){
        const k = thState.keyword.toLowerCase();
        if(!i.name.toLowerCase().includes(k) && !i.code.toLowerCase().includes(k)) return false;
      }
      return true;
    });
    document.getElementById('thCount').textContent = list.length;
    const body = document.getElementById('thBody');
    if(list.length===0){
      body.innerHTML = `<tr><td colspan="8" style="text-align:center;color:var(--slate-light);padding:40px;">查無符合條件的指標</td></tr>`;
      return;
    }
    const frozen = thState.freezeSim;
    body.innerHTML = list.map(i=>`
      <tr data-code="${i.code}">
        <td class="code-cell">${i.code}${frozen?' <span class="badge badge-gray" style="margin-left:4px;">🔒</span>':''}</td>
        <td class="name-cell">${i.name}</td>
        <td>${frozen?`<span class="mono">${i.target}${i.unit}</span>`:`<input type="number" step="0.1" class="mini th-target" value="${i.target}"> ${i.unit}`}</td>
        <td>${frozen?`<span class="mono">${i.avg}${i.unit}</span>`:`<input type="number" step="0.1" class="mini th-avg" value="${i.avg}"> ${i.unit}`}</td>
        <td>${frozen?`<span class="mono">${i.thLow}</span>`:`<input type="number" step="0.1" class="mini th-low" value="${i.thLow}">`}</td>
        <td>${frozen?`<span class="mono">${i.thHigh}</span>`:`<input type="number" step="0.1" class="mini th-high" value="${i.thHigh}">`}</td>
        <td class="subtext">${i.updateTime}</td>
        <td class="subtext">${i.updater}</td>
      </tr>`).join('');

    if(!frozen){
      body.querySelectorAll('tr').forEach(tr=>{
        const code = tr.dataset.code;
        tr.querySelector('.th-avg').addEventListener('change', e=>{
          const avg = parseFloat(e.target.value);
          const sd = Math.abs(avg*0.28) || 0.3; // 示意標準差估算
          tr.querySelector('.th-low').value = (avg - 2*sd).toFixed(1);
          tr.querySelector('.th-high').value = (avg + 2*sd).toFixed(1);
          showToast(`${code}：已依新平均值重新計算閾值（μ±2σ）`);
        });
      });
    }
  }
  renderTable();
}

          const f = input.files[0];
          if(!f) return;
          const okExt = ['pdf','doc','docx','xls','xlsx','ppt','pptx'].includes(fileExt(f.name));
          if(!okExt){ showToast('檔案格式不支援，請上傳 pdf/doc/docx/xls/xlsx/ppt/pptx'); return; }
          pendingFile = f;
          label.textContent = `已選擇：${f.name}（${(f.size/1024).toFixed(0)} KB）`;
          saveBtn.disabled = false;
        });
        saveBtn.addEventListener('click', ()=>{
          if(!pendingFile) return;
          const objectUrl = URL.createObjectURL(pendingFile);
          IMPROVEMENT_LINKS[`${code}_${idx}`] = {
            type:'file', fileName: pendingFile.name, fileSize: (pendingFile.size/1024).toFixed(0)+' KB',
            objectUrl, savedBy:'目前使用者', time: new Date().toLocaleString('sv-SE').slice(0,16)
          };
          showToast(`${code}：已上傳 ${ANNUAL_MONTHS[idx]} 改善方案檔案`);
          document.getElementById('miniModalOverlay').classList.remove('active');
          renderTable();
        });
      }
    }
    document.getElementById('imLinkTabs').querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        mode = b.dataset.m;
        document.getElementById('imLinkTabs').querySelectorAll('button').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        renderPane();
      });
    });
    renderPane();
  };
}

window.toggleIndicatorStatus = function(code){
  const i = INDICATORS.find(x=>x.code===code);
  if(!i) return;
  i.status = i.status==='停用' ? '正常' : '停用';
  i.updateTime = new Date().toLocaleString('sv-SE').slice(0,16);
  i.updater = '目前使用者';
  showToast(`${code}：狀態已切換為「${i.status}」`);
  if(window.renderIndMaintRefresh) window.renderIndMaintRefresh();
};

function nextIndicatorCode(){
  let n = INDICATORS.length + 1;
  let code;
  do { code = `NEW-${String(n).padStart(3,'0')}`; n++; } while(INDICATORS.some(x=>x.code===code));
  return code;
}

// 指標編輯視窗：整合「基本資料」與「分子/分母 SQL邏輯」三個分頁於同一視窗
// initialTab: 'basic' | 'num' | 'den'；onSaved：儲存後的回呼（未指定時預設刷新本頁列表）
// prefill：新增指標時可帶入預設欄位值（例如由 AI 助手草稿帶入）
window.openIndicatorEditForm = function(code, initialTab, onSaved, prefill){
  const isNew = !code;
  const i = isNew ? Object.assign({
    code:'', name:'', category:CATEGORIES[1], l2:'', l3:'', unit:'%', genMethod:'手工', status:'正常',
    percentile:50, trend:'flat', target:0, avg:0, thLow:0, thHigh:0,
    calc:'', numerator:'', denominator:'', inclusion:'', definition:'', note:'', version:'v1.0（新建）',
    updateTime:new Date().toLocaleString('sv-SE').slice(0,16), updater:'目前使用者'
  }, prefill||{}) : INDICATORS.find(x=>x.code===code);
  if(!i){ showToast('找不到指標資料'); return; }

  const refresh = () => { if(onSaved) onSaved(); else if(window.renderIndMaintRefresh) window.renderIndMaintRefresh(); };
  let activeTab = (!isNew && initialTab) ? initialTab : 'basic';

  const renderL2Options = (cat, selected) => {
    if(cat==='TCPI'){
      const allL3 = Object.entries(TCPI_L2).map(([l2,arr])=>`<optgroup label="${l2}">${arr.map(x=>`<option value="${x}" ${x===selected?'selected':''}>${x}</option>`).join('')}</optgroup>`).join('');
      return `<option value="">（無）</option>${allL3}`;
    }
    if(cat==='P4P'){
      return `<option value="">（無）</option>${P4P_L2.map(x=>`<option value="${x}" ${x===selected?'selected':''}>${x}</option>`).join('')}`;
    }
    return `<option value="">（不適用）</option>`;
  };

  function basicPaneHtml(){
    return `
    <div class="formgrid">
      <div class="field"><label>指標代碼${isNew?'':'（既有指標不可修改）'}</label><input type="text" id="imfCode" value="${escapeHtml(i.code||(isNew?nextIndicatorCode():''))}" ${isNew?'':'disabled'}></div>
      <div class="field"><label>指標名稱</label><input type="text" id="imfName" value="${escapeHtml(i.name)}"></div>
      <div class="field"><label>分類</label>
        <select id="imfCategory">${CATEGORIES.slice(1).map(c=>`<option value="${c}" ${c===i.category?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="field"><label>次分類（TCPI／P4P適用）</label><select id="imfL2">${renderL2Options(i.category, i.category==='TCPI' ? i.l3 : i.l2)}</select></div>
      <div class="field"><label>單位</label>
        <select id="imfUnit">${UNIT_OPTIONS.map(u=>`<option value="${u}" ${u===i.unit?'selected':''}>${u}</option>`).join('')}</select>
      </div>
      <div class="field"><label>產生方式</label>
        <select id="imfMethod"><option value="系統" ${i.genMethod==='系統'?'selected':''}>系統</option><option value="手工" ${i.genMethod==='手工'?'selected':''}>手工</option></select>
      </div>
      <div class="field"><label>狀態</label>
        <select id="imfStatus"><option value="正常" ${i.status==='正常'?'selected':''}>正常</option><option value="停用" ${i.status==='停用'?'selected':''}>停用</option></select>
      </div>
      <div class="field"><label>提報單位</label><input type="text" id="imfReportUnit" value="${escapeHtml(i.reportUnit||reportUnitOf(i))}"></div>
      <div class="field full"><label>說明／定義</label><textarea id="imfDefinition" rows="3" style="width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:13px;font-family:inherit;">${escapeHtml(i.definition||'')}</textarea></div>
      <div class="field full"><label>計算方式</label><textarea id="imfCalc" rows="2" style="width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:13px;font-family:inherit;">${escapeHtml(i.calc||'')}</textarea></div>
      <div class="field"><label>分子計算方式（摘要）</label><textarea id="imfNumerator" rows="2" style="width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:13px;font-family:inherit;">${escapeHtml(i.numerator||'')}</textarea></div>
      <div class="field"><label>分母計算方式（摘要）</label><textarea id="imfDenominator" rows="2" style="width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:13px;font-family:inherit;">${escapeHtml(i.denominator||'')}</textarea></div>
      <div class="field full"><p class="subtext" style="margin:-6px 0 0 0;">完整操作型定義與 SQL 邏輯請至「分子邏輯 SQL」／「分母邏輯 SQL」分頁維護，儲存後會同步更新此處摘要。</p></div>
      <div class="field full"><label>收案方式／相關說明</label><textarea id="imfInclusion" rows="2" style="width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:13px;font-family:inherit;">${escapeHtml(i.inclusion||'')}</textarea></div>
      <div class="field full"><label>備註</label><textarea id="imfNote" rows="2" style="width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:13px;font-family:inherit;">${escapeHtml(i.note||'')}</textarea></div>
      <div class="field"><label>指標版本</label><input type="text" id="imfVersion" value="${escapeHtml(i.version||'')}"></div>
    </div>
    <div class="notice" style="margin-top:14px;">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6.2" stroke="#8A5D0C" stroke-width="1.3"/><path d="M7.5 5v3.4M7.5 10.4h.01" stroke="#8A5D0C" stroke-width="1.4" stroke-linecap="round"/></svg>
      指標新增需提交資訊部處理，建置完成後續維護（如目標值、閾值、分子/分母 SQL）再交由使用者自行操作。
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('miniModalOverlay').classList.remove('active')">取消</button>
      <button class="btn btn-primary btn-sm" id="imfSaveBtn">${isNew?'新增並儲存':'儲存變更'}</button>
    </div>`;
  }

  function bindBasicPane(){
    document.getElementById('imfCategory').addEventListener('change', e=>{
      document.getElementById('imfL2').innerHTML = renderL2Options(e.target.value, '');
    });
    document.getElementById('imfSaveBtn').addEventListener('click', ()=>{
      const code2 = document.getElementById('imfCode').value.trim();
      const name = document.getElementById('imfName').value.trim();
      if(!code2 || !name){ showToast('指標代碼與名稱為必填'); return; }
      if(isNew && INDICATORS.some(x=>x.code===code2)){ showToast('指標代碼已存在，請重新輸入'); return; }

      const category = document.getElementById('imfCategory').value;
      const l2val = document.getElementById('imfL2').value;
      const payload = {
        name, category,
        l2: category==='TCPI' ? (Object.keys(TCPI_L2).find(k=>TCPI_L2[k].includes(l2val))||'') : (category==='P4P' ? '' : ''),
        l3: category==='TCPI' ? l2val : '',
        unit: document.getElementById('imfUnit').value,
        genMethod: document.getElementById('imfMethod').value,
        status: document.getElementById('imfStatus').value,
        reportUnit: document.getElementById('imfReportUnit').value.trim(),
        definition: document.getElementById('imfDefinition').value,
        calc: document.getElementById('imfCalc').value,
        numerator: document.getElementById('imfNumerator').value,
        denominator: document.getElementById('imfDenominator').value,
        inclusion: document.getElementById('imfInclusion').value,
        note: document.getElementById('imfNote').value,
        version: document.getElementById('imfVersion').value,
        updateTime: new Date().toLocaleString('sv-SE').slice(0,16),
        updater: '目前使用者',
      };
      if(category==='P4P') payload.l2 = l2val;

      if(isNew){
        INDICATORS.push(Object.assign({}, i, payload, {code:code2}));
        ORIGINAL_OPDEF[`${code2}_num`] = payload.numerator || '';
        ORIGINAL_OPDEF[`${code2}_den`] = payload.denominator || '';
        showToast(`已新增指標 ${code2}`);
        document.getElementById('miniModalOverlay').classList.remove('active');
      } else {
        Object.assign(i, payload);
        showToast(`${code2}：指標基本檔已儲存`);
        document.getElementById('miniModalOverlay').classList.remove('active');
      }
      refresh();
      const navTag = document.getElementById('navCountIndMaint');
      if(navTag) navTag.textContent = INDICATORS.length;
    });
  }

  function render(){
    if(isNew){
      openMiniModal('新增指標', basicPaneHtml());
      bindBasicPane();
      return;
    }
    openMiniModal(`${i.code}　指標維護`, `
      <div class="pilltabs" id="indTabs" style="margin-bottom:14px;">
        <button data-t="basic" class="${activeTab==='basic'?'active':''}">基本資料</button>
        <button data-t="num" class="${activeTab==='num'?'active':''}">分子邏輯 SQL${sqlIsCustom(i.code,'num')?' 🟠':''}</button>
        <button data-t="den" class="${activeTab==='den'?'active':''}">分母邏輯 SQL${sqlIsCustom(i.code,'den')?' 🟠':''}</button>
      </div>
      <div id="indFormPane"></div>
    `);
    document.getElementById('indTabs').querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        activeTab = b.dataset.t;
        document.getElementById('indTabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active', x===b));
        renderPane();
      });
    });
    renderPane();
  }

  function renderPane(){
    const pane = document.getElementById('indFormPane');
    if(activeTab==='basic'){
      pane.innerHTML = basicPaneHtml();
      bindBasicPane();
    } else {
      const part = activeTab; // 'num' | 'den'
      pane.innerHTML = `
        <div class="subtext" style="margin-bottom:6px;">${i.name} — 系統排程計算時使用之 SQL 邏輯，可自行修改後儲存生效。</div>
        ${sqlEditorBodyHtml(i.code, part)}
      `;
      bindSqlEditorEvents(i.code, part, ()=>{
        refresh();
        // 更新分頁標籤上的自訂圓點與表格內「已自訂」徽章
        document.getElementById('indTabs').querySelectorAll('button').forEach(b=>{
          if(b.dataset.t==='num') b.innerHTML = `分子邏輯 SQL${sqlIsCustom(i.code,'num')?' 🟠':''}`;
          if(b.dataset.t==='den') b.innerHTML = `分母邏輯 SQL${sqlIsCustom(i.code,'den')?' 🟠':''}`;
        });
        renderPane();
      });
    }
  }

  render();
};

// ===================== 9. AI 指標助手（示意功能） =====================
// 純前端規則式關鍵字解析，模擬「一句話找指標／一句話生成指標」的 AI 助手體驗。
// 正式導入時建議改由後端串接 LLM（如 Claude API）解析語意並回傳結構化結果。

const AI_CATEGORY_HINTS = [
  { cat:"TCPI", keys:["tcpi","加護病房","icu","手術","精神科","約束","跌倒","壓傷"] },
  { cat:"P4P", keys:["p4p","論質計酬","急性後期","pac"] },
  { cat:"THIS", keys:["this","回診","急診壅塞","等候"] },
  { cat:"DQI", keys:["dqi","病歷","資料品質"] },
  { cat:"對外提報", keys:["對外提報","通報","疾管署","法定傳染病"] },
  { cat:"營運分析", keys:["營運","住院天數","病床","佔床","使用率"] },
];
const AI_GENERATE_HINTS = ["新增","建立","建置","生成","新建","做一個","做一支","幫我做","幫我建立","幫我新增","幫我建置","加入一個"];
const AI_FIND_HINTS = ["找","查","搜尋","查詢","有哪些","看看","列出","顯示","哪些指標"];
const AI_LIGHT_HINTS = [
  { key:"紅燈", test:p=>zone(p)==='red' }, { key:"紅色", test:p=>zone(p)==='red' }, { key:"異常", test:p=>zone(p)==='red' },
  { key:"黃燈", test:p=>zone(p)==='amber' }, { key:"綠燈", test:p=>zone(p)==='green' }, { key:"良好", test:p=>zone(p)==='green' },
];

function aiDetectCategory(text){
  const low = text.toLowerCase();
  for(const h of AI_CATEGORY_HINTS){ if(h.keys.some(k=>low.includes(k))) return h.cat; }
  return null;
}
function aiDetectUnit(text){
  if(/比率|率|百分|%/.test(text)) return '%';
  if(/千分|‰/.test(text)) return '‰';
  if(/人次/.test(text)) return '人次';
  if(/天數|天/.test(text)) return '天';
  return '%';
}
function aiIsGenerateIntent(text){ return AI_GENERATE_HINTS.some(k=>text.includes(k)); }

function aiExtractName(text){
  const m = text.match(/[「『"']([^」』"']{2,40})[」』"']/);
  if(m) return m[1];
  let cleaned = text;
  [...AI_GENERATE_HINTS, "指標", "一個", "一支", "幫我"].forEach(k=>{ cleaned = cleaned.split(k).join(''); });
  cleaned = cleaned.replace(/(TCPI|P4P|THIS|DQI|對外提報|營運分析|分類|百分比|人次|天數|的|，|,|。)/gi, ' ').trim();
  return cleaned || '未命名指標草稿';
}

function aiFindIndicators(text){
  const low = text.toLowerCase();
  const cat = aiDetectCategory(text);
  const lightHint = AI_LIGHT_HINTS.find(h=>text.includes(h.key));
  const statusHint = text.includes('停用') ? '停用' : (text.includes('正常') && !text.includes('不正常') ? '正常' : null);
  const methodHint = text.includes('手工') ? '手工' : (text.includes('系統') ? '系統' : null);
  // 移除意圖詞、分類詞、燈號詞後剩下的字，當作關鍵字比對指標名稱/代碼
  let kw = text;
  [...AI_FIND_HINTS, ...AI_CATEGORY_HINTS.flatMap(h=>h.keys), '指標','相關','的'].forEach(k=>{ kw = kw.split(k).join(' '); });
  kw = kw.replace(/[，,。？?！!]/g,' ').trim();
  const kwTokens = kw.split(/\s+/).filter(t=>t.length>=2);

  // 明確條件（分類／燈號／狀態／產生方式）視為必要篩選（AND），避免像「TCPI裡紅燈」誤把TCPI裡的綠燈也列入
  let pool = INDICATORS;
  if(cat) pool = pool.filter(i=>i.category===cat);
  if(lightHint) pool = pool.filter(i=>lightHint.test(i.percentile));
  if(statusHint) pool = pool.filter(i=>i.status===statusHint);
  if(methodHint) pool = pool.filter(i=>i.genMethod===methodHint);

  const scored = pool.map(i=>{
    let score = 1; // 通過上述必要篩選即有基礎分數
    kwTokens.forEach(t=>{
      if(i.name.includes(t) || i.code.toLowerCase().includes(t.toLowerCase())) score += 2;
    });
    if(text.toUpperCase().includes(i.code)) score += 5;
    return { i, score };
  }).sort((a,b)=>b.score-a.score).slice(0,8).map(x=>x.i);

  // 若有明確條件但完全無結果，退回全庫依關鍵字比對，避免使用者拿不到任何回應
  if(scored.length===0 && kwTokens.length>0){
    const fallback = INDICATORS.filter(i=> kwTokens.some(t=> i.name.includes(t) || i.code.toLowerCase().includes(t.toLowerCase()))).slice(0,8);
    return { results: fallback, cat, lightHint, statusHint, methodHint, kwTokens };
  }

  return { results: scored, cat, lightHint, statusHint, methodHint, kwTokens };
}

function aiGenerateDraft(text){
  const category = aiDetectCategory(text) || CATEGORIES[1];
  const unit = aiDetectUnit(text);
  const name = aiExtractName(text);
  const genMethod = text.includes('手工') ? '手工' : '系統';
  const definition = `（AI 草稿，請確認並補充）依描述「${text}」自動產生：說明本指標之收案對象、計算期間與排除條件。`;
  const calc = `分子/分母 × 100${unit==='%'?'%':''}`;
  return { name, category, unit, genMethod, definition, calc };
}

function aiOpenDrawerFor(code){ closeAIAssistant(); document.querySelector('.nav-item[data-view=manage]').click(); setTimeout(()=>openIndicatorDrawer(code), 150); }

function aiAppendBubble(role, html){
  const log = document.getElementById('aiLog');
  const div = document.createElement('div');
  div.className = `chat-bubble ${role==='user'?'chat-user':'chat-ai'}`;
  div.innerHTML = html;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function aiRespond(text){
  if(aiIsGenerateIntent(text)){
    const draft = aiGenerateDraft(text);
    const draftIdx = AI_DRAFTS.push(draft) - 1;
    aiAppendBubble('ai', `
      我理解您想「新增指標」，已依描述產生草稿如下，請確認後再儲存：
      <div class="ai-result-card" style="cursor:default;">
        <div style="font-weight:600;font-size:13px;">${escapeHtml(draft.name)}</div>
        <div class="subtext" style="margin-top:4px;">分類：${draft.category}　單位：${draft.unit}　產生方式：${draft.genMethod}</div>
        <div class="subtext" style="margin-top:4px;">${escapeHtml(draft.definition)}</div>
      </div>
      <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="aiApplyDraftByIndex(${draftIdx})">套用到新增指標表單</button>
      <div class="subtext" style="margin-top:8px;">⚠️ 示意功能：實際名稱、計算方式仍需人工確認，指標新增仍須提交資訊部處理。</div>
    `);
  } else {
    const { results, cat, lightHint, statusHint } = aiFindIndicators(text);
    if(results.length===0){
      aiAppendBubble('ai', `找不到符合的指標，換個說法試試？例如指定分類（TCPI/P4P/THIS…）或關鍵字（如「跌倒」「再入院」）。`);
      return;
    }
    const condDesc = [cat?`分類=${cat}`:null, lightHint?`燈號=${lightHint.key}`:null, statusHint?`狀態=${statusHint}`:null].filter(Boolean).join('、');
    aiAppendBubble('ai', `
      ${condDesc?`我解讀到的條件：${condDesc}。`:''}找到 ${results.length} 筆相關指標，點擊可查看詳情：
      ${results.map(i=>`
        <div class="ai-result-card" onclick="aiOpenDrawerFor('${i.code}')">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="code-cell">${i.code}</span>${statusBadge(i.status)}
          </div>
          <div style="font-weight:600;font-size:13px;margin-top:3px;">${i.name}</div>
          <div class="subtext" style="margin-top:2px;">${i.category} · 與醫中比第${i.percentile}百分位（${zoneLabel(i.percentile)}）</div>
        </div>`).join('')}
    `);
  }
}

// 存放 AI 生成的指標草稿，供按鈕以索引取用，避免直接把 JSON 字串塞進 onclick 屬性造成解析問題
const AI_DRAFTS = [];
window.aiApplyDraftByIndex = function(idx){
  const draft = AI_DRAFTS[idx];
  if(!draft) return;
  closeAIAssistant();
  document.querySelector('.nav-item[data-view=indmaint]').click();
  setTimeout(()=> openIndicatorEditForm(null, 'basic', null, draft), 150);
};

function aiSend(){
  const input = document.getElementById('aiInput');
  const text = input.value.trim();
  if(!text) return;
  aiAppendBubble('user', escapeHtml(text));
  input.value = '';
  setTimeout(()=> aiRespond(text), 250); // 模擬思考延遲
}
window.aiSendExample = function(idx){
  const text = AI_EXAMPLE_CHIPS[idx];
  if(!text) return;
  document.getElementById('aiInput').value = text;
  aiSend();
};

const AI_EXAMPLE_CHIPS = [
  "幫我找TCPI裡面紅燈的指標",
  "有哪些跌倒相關的指標",
  "幫我建立一個「出院後7天內再急診比率」指標，DQI分類，百分比",
  "查詢停用的指標",
];

function openAIAssistant(){
  const overlay = document.getElementById('aiOverlay');
  overlay.classList.add('active');
  const log = document.getElementById('aiLog');
  if(!log.dataset.inited){
    log.dataset.inited = '1';
    aiAppendBubble('ai', `您好，我是 AI 指標助手（示意功能）。您可以：<br>① 用一句話描述想找的指標，我會幫您篩選；<br>② 用一句話描述新指標，我會幫您產生草稿供確認。`);
    const chips = document.getElementById('aiChips');
    chips.innerHTML = AI_EXAMPLE_CHIPS.map((c,idx)=>`<button class="btn btn-ghost btn-sm" style="font-size:11.5px;padding:5px 10px;" onclick="aiSendExample(${idx})">${escapeHtml(c)}</button>`).join('');
  }
  document.getElementById('aiInput').focus();
}
function closeAIAssistant(){ document.getElementById('aiOverlay').classList.remove('active'); }
document.getElementById('aiOverlay').addEventListener('click', e=>{ if(e.target.id==='aiOverlay') closeAIAssistant(); });
document.getElementById('aiSendBtn').addEventListener('click', aiSend);
document.getElementById('aiInput').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); aiSend(); }
});

// ===================== 初始化 =====================
renderView('dashboard');

</script>
